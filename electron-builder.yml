appId: pk.gov.tdcp.rms
productName: TDCP RMS
copyright: Tourism Development Corporation of Punjab
asar: false
directories:
  output: release
files:
  - desktop/main.mjs
  - desktop/preload.cjs
  - server/app.js
  - server/package.json
  - server/.env
  - server/.env.example
  - server/src/**/*
  - server/node_modules/**/*
  - client/dist/**/*
  - client/public/tdcp-logo.png
  - package.json
  - "!node_modules/**"
  - "!client/node_modules/**"
  - "!**/*.map"
  - "!**/README.md"
win:
  icon: client/public/tdcp-logo.png
  artifactName: ${productName}-Setup-${version}.${ext}
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TDCP RMS
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
